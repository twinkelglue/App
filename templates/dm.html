<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ partner.nickname }}님과의 대화 - ChatClub</title>
    <style>
        :root {
            --bg-color: #05070a; --card-bg: #121620; --border-color: #1e293b;
            --accent-blue: #00c6ff; --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg-color); color: white; font-family: -apple-system, BlinkMacSystemFont, sans-serif; display: flex; justify-content: center; }
        .chat-container { width: 100%; max-width: 480px; height: 100vh; display: flex; flex-direction: column; border-inline: 1px solid var(--border-color); }
        
        .header { padding: 12px 15px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; background: var(--card-bg); }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .prof-img { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; }
        
        /* 🟡 미팔로우 선톡 안내 배너 (카톡 스타일) */
        .unfollow-banner {
            background: #2a2010; border: 1px solid #f59e0b; padding: 10px 14px; margin: 10px; border-radius: 10px;
            display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; color: #fbbf24;
        }
        .btn-follow { background: #f59e0b; color: black; border: none; padding: 6px 12px; border-radius: 12px; font-weight: bold; cursor: pointer; }

        .msg-list { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg-item { max-width: 75%; padding: 8px 12px; border-radius: 12px; font-size: 0.85rem; word-break: break-all; cursor: pointer; user-select: none; }
        .my-msg { align-self: flex-end; background: var(--accent-blue); color: black; font-weight: 500; border-bottom-right-radius: 2px; }
        .other-msg { align-self: flex-start; background: var(--card-bg); border: 1px solid var(--border-color); border-bottom-left-radius: 2px; }
        .msg-time { font-size: 0.65rem; color: var(--text-muted); margin-top: 4px; }
        
        .input-box { padding: 10px; border-top: 1px solid var(--border-color); display: flex; gap: 8px; background: var(--card-bg); }
        .input-box input { flex: 1; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 16px; padding: 8px 14px; color: white; outline: none; }
        .btn-send { background: var(--accent-blue); border: none; padding: 8px 16px; border-radius: 16px; font-weight: bold; cursor: pointer; color: black; }
    </style>
</head>
<body>
<div class="chat-container">
    <!-- 상단 헤더 -->
    <div class="header">
        <div class="user-info">
            <a href="/" style="color:white; text-decoration:none; font-weight:bold; font-size:1.1rem; margin-right:5px;">⬅️</a>
            <img src="/static/uploads/{{ partner.profile_img or 'default.png' }}" class="prof-img">
            <div>
                <strong style="font-size:0.95rem;">{{ partner.nickname }}</strong>
                <div style="font-size:0.75rem; color:var(--text-muted);">@{{ partner.username }}</div>
            </div>
        </div>
    </div>

    <!-- 🟡 미팔로우 사용자 선톡 시 상단 알림 배너 -->
    {% if not is_following %}
        <div id="follow-banner" class="unfollow-banner">
            <span>⚠️ 팔로우하지 않은 사용자입니다.</span>
            <button class="btn-follow" onclick="addFriend('{{ partner.username }}')">친구 등록 (+팔로우)</button>
        </div>
    {% endif %}

    <!-- 메시지 목록 -->
    <div class="msg-list" id="msgContainer">
        {% for m in messages %}
            <div class="msg-item {% if m.sender == user %}my-msg{% else %}other-msg{% endif %}" 
                 {% if m.sender == user %}ondblclick="deleteMessage({{ m.id }})"{% endif %}>
                <div>{{ m.message }}</div>
                <div class="msg-time" style="text-align: {% if m.sender == user %}right{% else %}left{% endif %};">
                    {{ m.created_at.strftime('%H:%M') }}
                    {% if m.sender == user %}<span style="font-size:0.6rem; color:#475569;">(더블클릭시 삭제)</span>{% endif %}
                </div>
            </div>
        {% endfor %}
    </div>

    <!-- 메시지 입력창 -->
    <form action="/dm/{{ partner.username }}/send" method="POST" class="input-box">
        <input type="text" name="message" placeholder="메시지 입력..." required autocomplete="off">
        <button type="submit" class="btn-send">전송</button>
    </form>
</div>

<script>
    // 자동 스크롤 하단 이동
    const container = document.getElementById('msgContainer');
    container.scrollTop = container.scrollHeight;

    // 친구 등록 (팔로우) 처리
    function addFriend(username) {
        fetch(`/follow/${username}`, { method: 'POST' })
        .then(res => res.json())
        .then(data => {
            if(data.success) {
                alert('친구로 등록되었습니다!');
                document.getElementById('follow-banner').style.display = 'none';
            }
        });
    }

    // 🔥 내가 보낸 메시지 더블클릭 시 삭제 기능
    function deleteMessage(msgId) {
        if(confirm("이 메시지를 삭제하시겠습니까?")) {
            fetch(`/dm/message/${msgId}/delete`, { method: 'POST' })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    location.reload();
                } else {
                    alert("메시지 삭제에 실패했습니다.");
                }
            });
        }
    }
</script>
</body>
</html>
