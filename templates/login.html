<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - ChatClub</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }
        .header {
            text-align: center;
            margin-bottom: 32px;
        }
        .header h1 {
            font-size: 26px;
            color: #1a1a1a;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .header p {
            font-size: 14px;
            color: #666666;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #333333;
            margin-bottom: 8px;
        }
        .form-group input {
            width: 100%;
            height: 48px;
            padding: 0 16px;
            border: 1px solid #e1e4e8;
            border-radius: 10px;
            font-size: 15px;
            color: #1a1a1a;
            background-color: #f8f9fa;
            transition: all 0.2s ease;
        }
        .form-group input:focus {
            outline: none;
            border-color: #4A90E2;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.15);
        }
        .btn-submit {
            width: 100%;
            height: 50px;
            background-color: #4A90E2;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background-color: #357ABD;
        }
        .footer {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: #666666;
        }
        .footer a {
            color: #4A90E2;
            text-decoration: none;
            font-weight: 600;
            margin-left: 4px;
        }
        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>ChatClub 로그인</h1>
            <p>서비스 이용을 위해 로그인해 주세요</p>
        </div>
        <form action="/login" method="POST" onsubmit="return validateForm()">
            <div class="form-group">
                <label for="username">아이디</label>
                <input type="text" id="username" name="username" placeholder="아이디 입력" required autocomplete="off">
            </div>
            <div class="form-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password" placeholder="비밀번호 입력" required>
            </div>
            <button type="submit" class="btn-submit">로그인</button>
        </form>
        <div class="footer">
            계정이 없으신가요? <a href="/register">회원가입하기</a>
        </div>
    </div>

    <script>
        function validateForm() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!username || !password) {
                alert('아이디와 비밀번호를 모두 입력해 주세요.');
                return false;
            }
            return true;
        }
    </script>
</body>
</html>
